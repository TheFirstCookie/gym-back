<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#0e0c0a;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e0c0a;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#1a1714;border-top:4px solid #ff6b1a;">
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 18px;color:#f6f0e6;font-size:14px;font-weight:bold;letter-spacing:1px;">
                  FORGEFIT <span style="color:#ff6b1a;">SUPPLY</span>
                </p>
                <h1 style="margin:0 0 14px;color:#f6f0e6;font-size:24px;">Your email was changed</h1>
                <p style="margin:0 0 16px;color:#a89d8d;font-size:15px;line-height:1.6;">Your ForgeFit Supply account now uses <strong style="color:#f6f0e6;">{{ .Email }}</strong> instead of <strong style="color:#f6f0e6;">{{ .OldEmail }}</strong>. Order emails and sign-in links go to the new address from now on.</p>
                <p style="margin:12px 0 0;padding-top:16px;border-top:1px solid #352f28;color:#a89d8d;font-size:12px;line-height:1.6;">
                  Wasn't you? Write to us straight away so we can lock the account.<br><a href="{{ .SiteURL }}" style="color:#ff6b1a;text-decoration:none;">ForgeFit Supply</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
